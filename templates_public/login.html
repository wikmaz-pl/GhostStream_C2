<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#000;color:#0f0;text-align:center;padding-top:15vh;font-family:monospace; margin:0;} input{padding:15px;font-size:24px;text-align:center; width:80%; max-width:300px;} button{padding:15px 40px;background:#0f0;font-weight:bold;cursor:pointer;} .lang-switch { position: absolute; top: 10px; right: 20px; font-size: 18px; font-weight: bold; cursor: pointer; color: #555; } .lang-active { color: #0f0; text-shadow: 0 0 5px #0f0; }</style></head><body onload="initLang()"><div class="lang-switch"><span id="btn-pl" onclick="setLang('pl')">PL</span> | <span id="btn-en" onclick="setLang('en')">EN</span></div><h2 id="t-title">WPROWADŹ KOD</h2><form id="authForm" action="/auth" method="post"><input type="text" id="tokenInput" name="token" required autocomplete="off" value="{{ auto_token }}"><br><br><button type="submit" id="t-btn">WEJDŹ</button></form><script>const dict={pl:{title:"WPROWADŹ KOD",btn:"WEJDŹ"},en:{title:"ENTER ACCESS CODE",btn:"ACCESS"}}; function setLang(lang){document.getElementById('t-title').innerText=dict[lang].title; document.getElementById('t-btn').innerText=dict[lang].btn; document.getElementById('btn-pl').className=lang==='pl'?'lang-active':''; document.getElementById('btn-en').className=lang==='en'?'lang-active':'';} function initLang(){const userLang=navigator.language||navigator.userLanguage; setLang(userLang.startsWith('pl')?'pl':'en'); if(document.getElementById('tokenInput').value.length>0)document.getElementById('authForm').submit();}</script></body></html>
